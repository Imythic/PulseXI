<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PulseXI — Synthetic Match Insights Engine</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Pulse<span class="brand-accent">XI</span></span>
      <span class="brand-tag">Synthetic Match Insights Engine</span>
    </div>
    <div class="scoreboard" id="scoreboard">
      <span class="team home" id="homeName">Home</span>
      <span class="clock" id="clock">00:00</span>
      <span class="team away" id="awayName">Away</span>
    </div>
    <div class="controls">
      <button id="newMatchBtn" class="btn">New Match</button>
      <button id="playBtn" class="btn primary">▶ Play</button>
      <select id="speedSelect" class="btn" title="Playback speed">
        <option value="15">⏩ 15x speed</option>
        <option value="40" selected>⏩ 40x speed</option>
        <option value="90">⏩ 90x speed</option>
        <option value="180">⏩ 180x speed</option>
      </select>
      <label class="audio-toggle" title="Reads overlay commentary aloud — built for blind and partially-sighted fans">
        <input type="checkbox" id="audioToggle" /> 🔊 Audio commentary
      </label>
    </div>
  </header>

  <input type="range" id="scrubber" min="0" max="5400" value="0" class="scrubber" />

  <main class="layout">
    <section class="pitch-panel">
      <div class="stadium-glow"></div>
      <div class="broadcast-tag">● LIVE — PulseXI Tactical Cam</div>
      <div class="pitch-stage">
        <div class="pitch" id="pitch">
          <div class="pitch-content" id="pitchContent">
            <div class="pitch-line halfway"></div>
            <div class="pitch-circle"></div>
            <div class="pitch-spot center"></div>
            <div class="pitch-box left"></div>
            <div class="pitch-box left small"></div>
            <div class="pitch-arc left"></div>
            <div class="pitch-spot left"></div>
            <div class="pitch-box right"></div>
            <div class="pitch-box right small"></div>
            <div class="pitch-arc right"></div>
            <div class="pitch-spot right"></div>
            <div class="goal left"></div>
            <div class="goal right"></div>
            <div class="corner-arc tl"></div>
            <div class="corner-arc tr"></div>
            <div class="corner-arc bl"></div>
            <div class="corner-arc br"></div>
            <div class="players-layer" id="playersLayer"></div>
            <div class="ball" id="ball"></div>
          </div>
        </div>
        <div class="player-popup hidden" id="playerPopup"></div>
        <div class="camera-controls">
          <button id="zoomOutBtn" class="cam-btn" type="button" title="Zoom out">−</button>
          <span class="zoom-label" id="zoomLabel">1.0x</span>
          <button id="zoomInBtn" class="cam-btn" type="button" title="Zoom in">+</button>
          <label class="cam-toggle" title="Camera zooms in and tracks wherever the ball is">
            <input type="checkbox" id="followBallToggle" /> 📷 Follow ball
          </label>
        </div>
      </div>
      <div class="overlay-zone" id="overlayZone"></div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card" id="homeStats"></div>
        <div class="momentum-bar-wrap">
          <div class="momentum-label">Control ⟷ Chaos</div>
          <div class="momentum-bar"><div class="momentum-fill" id="momentumFill"></div></div>
        </div>
        <div class="stat-card" id="awayStats"></div>
      </div>
    </section>

    <aside class="persona-panel">
      <h2>Personalize this match</h2>
      <label>Mode
        <select id="modeSelect">
          <option value="fan">Fan</option>
          <option value="analyst">Analyst</option>
          <option value="player_focus">Player Focus</option>
        </select>
      </label>
      <label>Favorite club
        <select id="teamSelect"><option value="">Any</option></select>
      </label>
      <label id="playerLabel" class="hidden">Favorite player
        <select id="playerSelect"></select>
      </label>
      <label>Language
        <select id="langSelect">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </label>

      <h3>Your feed</h3>
      <div class="persona-feed" id="personaFeed"></div>
    </aside>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
